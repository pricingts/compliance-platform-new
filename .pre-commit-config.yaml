repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pytest-unit
        name: Run unit tests
        entry: python3 -m pytest tests/unit -x -q --tb=line
        language: system
        pass_filenames: false
        always_run: true
